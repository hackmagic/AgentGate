name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture boundaries
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Contract / spec validation
        run: npm run validate-specs

      - name: Build
        run: npm run build

      - name: Smoke test the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js validate packs/deep-work
          node dist/cli.js list --policy packs/deep-work
          node dist/cli.js compile --policy packs/deep-work --out out --target all
          test -f out/AGENTS.md
          test -f out/mcp.json
          ls out/skills

      - name: Compilation parity
        run: |
          node dist/cli.js verify --policy packs/deep-work
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const manifest = JSON.parse(readFileSync('out/compile-manifest.json', 'utf8'));
            const hashes = new Set(manifest.artifacts.map((entry) => entry.source_hash));
            if (hashes.size !== 1) {
              console.error('artifacts disagree on source_hash:', [...hashes]);
              process.exit(1);
            }
            if (!manifest.format_version) {
              console.error('manifest has no format_version; consumers cannot tell stale from older');
              process.exit(1);
            }
            console.log('parity ok:', manifest.artifacts.length, 'targets, format', manifest.format_version);
          "

      - name: Emitted artifacts carry their format version
        run: |
          grep -q '编译格式 v1' out/AGENTS.md
          grep -q '编译格式 v1' out/README.md
          grep -q '编译格式 v1' out/skills/agent-gate-morning-focus-protection/SKILL.md

      - name: Policy lifecycle projects from audit history
        run: |
          node --input-type=module -e "
            import { writeFileSync } from 'node:fs';
            import { AgentGate, JsonlAuditStore, projectLifecycle } from './dist/index.js';
            import { loadPolicies } from './dist/index.js';
            writeFileSync('audit.jsonl', '');
            const policies = loadPolicies(['packs/deep-work']).map((entry) => entry.policy);
            const gate = new AgentGate({
              policies,
              audit: new JsonlAuditStore('audit.jsonl'),
              clock: { now: () => new Date('2026-11-20T01:00:00Z') },
              timezone: 'Asia/Shanghai',
            });
            gate.evaluate({
              id: 'ci-evt', type: 'focus_block_started', timestamp: '2026-11-20T01:00:00Z',
              source: 'manual', context: { app: 'Code', project: 'agent-gate', language: 'typescript' },
              duration_seconds: null, metrics: {}, metadata: {},
            });
            const store = new JsonlAuditStore('audit.jsonl');
            const state = projectLifecycle(policies, store.query(), new Date('2026-11-20T01:05:00Z'));
            const active = state.filter((entry) => entry.state === 'active');
            if (active.length === 0) {
              console.error('lifecycle projection found no active policy after a match:', JSON.stringify(state));
              process.exit(1);
            }
            console.log('lifecycle ok:', active.map((entry) => entry.policy_id).join(','));
          "

      - name: Audit whitelist never widens
        run: |
          node --input-type=module -e "
            import { AUDIT_FIELD_WHITELIST } from './dist/index.js';
            const expected = ['event_id','policy_id','decision','signal_id','user_response','timestamp','engine_version','degraded','reason'];
            const actual = [...AUDIT_FIELD_WHITELIST].sort();
            if (JSON.stringify(actual) !== JSON.stringify([...expected].sort())) {
              console.error('audit whitelist changed:', actual);
              process.exit(1);
            }
            console.log('audit whitelist intact:', actual.length, 'fields');
          "

  windows:
    name: check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run check
        shell: pwsh
