policy:
  id: context-thrash-warning
  version: 2
  description: 在某个应用里没待多久就切走时，提醒先写下一句「我到底在等什么」
  priority: 55
  trigger:
    event: app_switch
  conditions:
    all:
      # Both branches must require a *short* dwell. The previous version had a
      # bare `time_window` as the second `any` branch, so any evening switch
      # qualified — including switching back into the editor to work. A nudge
      # that fires when you return to work is noise, not guidance.
      - any:
          - all:
              - duration_seconds: "< 120"
              - time_window: "09:00-20:00"
          - all:
              - duration_seconds: "< 300"
              - time_window: "21:00-23:59"
  decision: suggest
  action:
    type: write_down_blocker
    scope: [attention]
    parameters:
      duration_minutes: 3
  safety:
    requires_approval: false
    rationale: 只给一条可忽略的建议，不拦截任何切换、不改系统状态
    reversible: true
    audit_level: summary
  presentation:
    animation_hint: thinking
    bubble_text: 这个应用只待了两分钟？
    actions:
      - label: 好，我写一句
        action_id: approve
      - label: 忽略
        action_id: dismiss
